services:
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./app/backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - SUPABASE_URL=http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
    networks:
      - portfolio_network

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    env_file:
      - ./app/frontend/.env.local
    environment:
      - SUPABASE_URL=http://host.docker.internal:54321
      - INTERNAL_API_URL=http://backend:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - portfolio_network

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    ports:
      - "3000:3000"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - portfolio_network
    depends_on:
      - frontend

  worker:
    build:
      context: ./app/backend
      dockerfile: Dockerfile.worker
    container_name: portfolio-worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/nginx/conf.d:/etc/nginx/conf.d
    env_file:
      - ./app/backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - SUPABASE_URL=http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - portfolio_network
    depends_on:
      - backend

networks:
  portfolio_network:
    name: portfolio_network
    driver: bridge
